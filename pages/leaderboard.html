<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — Bank Sampah Digital</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="../index.html" class="navbar-brand">
      ♻ GreenCycle
    </a>
    <ul class="navbar-menu">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="setor.html">Setor Sampah</a></li>
      <li><a href="leaderboard.html" class="aktif">Leaderboard</a></li>
      <li><button class="btn btn-outline" style="padding:7px 16px;" onclick="logout()">Keluar</button></li>
    </ul>
  </nav>

  <div class="halaman">

    <!-- HEADER -->
    <div style="text-align:center; margin-bottom: 32px;">
      <div style="font-size: 48px; margin-bottom: 8px;">🏆</div>
      <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 6px;">Leaderboard Warga</h1>
      <p style="color: #6B7280; font-size: 14px;">Siapa yang paling rajin daur ulang bulan ini?</p>
    </div>

    <!-- TOP 3 PODIUM -->
    <div id="podium" style="display:flex; justify-content:center; align-items:flex-end;
      gap: 12px; margin-bottom: 32px; flex-wrap: wrap;">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>

    <!-- FILTER KELURAHAN -->
    <div style="display:flex; align-items:center; justify-content:space-between;
      flex-wrap:wrap; gap:12px; margin-bottom: 16px;">
      <h2 class="section-title" style="margin-bottom:0;">Semua Peringkat</h2>
      <select id="filter-kelurahan" onchange="muatLeaderboard()"
        style="padding:8px 14px; border-radius:8px; border:1.5px solid #D1D5DB;
        font-size:14px; background:white; cursor:pointer;">
        <option value="">Semua Kelurahan</option>
        <option>Bukit Lama</option>
        <option>Bukit Baru</option>
        <option>Demang Lebar Daun</option>
        <option>Ilir Barat I</option>
        <option>Ilir Barat II</option>
        <option>Ilir Timur I</option>
        <option>Ilir Timur II</option>
        <option>Ilir Timur III</option>
        <option>Kalidoni</option>
        <option>Kemuning</option>
        <option>Kertapati</option>
        <option>Plaju</option>
        <option>Seberang Ulu I</option>
        <option>Seberang Ulu II</option>
        <option>Sematang Borang</option>
        <option>Sukarami</option>
      </select>
    </div>

    <!-- LIST LEADERBOARD -->
    <div id="list-leaderboard">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>

    <!-- CTA -->
    <div style="text-align:center; margin-top:32px;">
      <a href="setor.html" class="btn btn-hijau btn-lg">
        ♻ Setor Sekarang & Naikkan Peringkat
      </a>
    </div>

  </div>

  <!-- FOOTER -->
  <footer style="background:var(--hijau-gelap); color:white; text-align:center;
    padding:20px; margin-top:40px; font-size:13px; opacity:.9;">
    © 2025 GreenCycle — Palembang
  </footer>

  <script type="module">
    import { supabase } from '../js/supabase.js'

    const { data: { user } } = await supabase.auth.getUser()

    // Muat podium top 3
    async function muatPodium() {
      const { data } = await supabase
        .from('profiles')
        .select('nama, kelurahan, total_poin')
        .order('total_poin', { ascending: false })
        .limit(3)

      const podium = document.getElementById('podium')

      if (!data?.length) {
        podium.innerHTML = `<p style="color:#6B7280;">Belum ada data peringkat.</p>`
        return
      }

      const posisi = [
        { index: 1, icon: '🥈', bg: '#E5E7EB', tinggi: '100px', urutan: 1 },
        { index: 0, icon: '🥇', bg: '#FEF3C7', tinggi: '130px', urutan: 0 },
        { index: 2, icon: '🥉', bg: '#FEE8D3', tinggi: '80px',  urutan: 2 },
      ]

      podium.innerHTML = posisi.map(p => {
        const w = data[p.index]
        if (!w) return ''
        const isMe = user && w.nama === data[p.index]?.nama
        return `
          <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
            <div style="font-size:28px;">${p.icon}</div>
            <div style="
              width: 80px; background: ${p.bg};
              border-radius: 12px 12px 0 0;
              height: ${p.tinggi};
              display:flex; flex-direction:column;
              align-items:center; justify-content:center;
              padding: 8px; text-align:center;
            ">
              <div style="font-size:22px; font-weight:700; line-height:1.2; margin-bottom:4px;">
                #${p.index + 1}
              </div>
            </div>
            <div style="text-align:center; max-width:90px;">
              <div style="font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden;
                text-overflow:ellipsis;">${w.nama || 'Warga'}</div>
              <div style="font-size:11px; color:#6B7280;">${w.kelurahan || '—'}</div>
              <div style="font-weight:700; color:var(--hijau-utama); font-size:13px; margin-top:2px;">
                ${(w.total_poin || 0).toLocaleString('id-ID')} pts
              </div>
            </div>
          </div>
        `
      }).join('')
    }

    // Muat list leaderboard
    window.muatLeaderboard = async function () {
      const kelurahan = document.getElementById('filter-kelurahan').value
      const container = document.getElementById('list-leaderboard')
      container.innerHTML = `<div class="loading-center"><div class="spinner"></div></div>`

      let query = supabase
        .from('profiles')
        .select('id, nama, kelurahan, total_poin')
        .order('total_poin', { ascending: false })
        .limit(50)

      if (kelurahan) query = query.eq('kelurahan', kelurahan)

      const { data, error } = await query

      if (error || !data?.length) {
        container.innerHTML = `
          <div style="text-align:center; padding:32px; color:#6B7280;">
            Belum ada warga di kelurahan ini.
          </div>`
        return
      }

      const medali = ['🥇', '🥈', '🥉']
      const rankClass = ['emas', 'perak', 'perunggu']

      container.innerHTML = data.map((w, i) => {
        const isMe = user && w.id === user.id
        return `
          <div class="leaderboard-item ${isMe ? 'saya' : ''}">
            <div class="lb-rank ${rankClass[i] || ''}">
              ${i < 3 ? medali[i] : i + 1}
            </div>
            <div class="lb-avatar" style="${isMe ? 'background:var(--hijau-utama);color:white;' : ''}">
              ${w.nama ? w.nama[0].toUpperCase() : '?'}
            </div>
            <div style="flex:1;">
              <div class="lb-nama">
                ${w.nama || 'Warga'}
                ${isMe ? '<span class="badge badge-hijau" style="margin-left:6px;font-size:10px;">Kamu</span>' : ''}
              </div>
              <div class="lb-kelurahan">${w.kelurahan || '—'}</div>
            </div>
            <div class="lb-poin">${(w.total_poin || 0).toLocaleString('id-ID')} pts</div>
          </div>
        `
      }).join('')
    }

    window.logout = async function () {
      await supabase.auth.signOut()
      window.location.href = '../index.html'
    }

    muatPodium()
    muatLeaderboard()
  </script>

</body>
</html>
